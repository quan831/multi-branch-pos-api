$kind: http-request
url: "{{base_url}}/orders/history"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Order history should be accessible", function () {
          pm.response.to.have.status(200);
      });
      if (pm.environment.get("username") === "staff1") {
          pm.test("Staff should only see their own branch orders", function () {
              const response = pm.response.json();
              if (Array.isArray(response)) {
                  response.forEach(order => {
                      pm.expect(order.branchId).to.equal(1); // staff1 is in branch 1
                  });
              }
          });
      }
    language: text/javascript
examples: ./.resources/Order History.resources/examples
order: 2000
