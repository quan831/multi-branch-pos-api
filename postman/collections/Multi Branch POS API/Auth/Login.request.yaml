$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      pm.test("Status is 200", function () { pm.response.to.have.status(200); });
      pm.test("Login successful", function () { pm.expect(response.message).to.equal("Login successful"); });
      if (response.token) {
          pm.environment.set("token", response.token);
      }
    language: text/javascript
examples: ./.resources/Login.resources/examples
order: 1000
