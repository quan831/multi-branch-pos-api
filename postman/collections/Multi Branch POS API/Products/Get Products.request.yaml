$kind: http-request
url: "{{base_url}}/products"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test(\"Status is 200\", function () { pm.response.to.have.status(200); });
    language: text/javascript
examples: ./.resources/Get Products.resources/examples
order: 3000
